[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/generate-exercises"
  to = "/.netlify/functions/generate-exercises"
  status = 200

[[redirects]]
  from = "/api/tutor"
  to = "/.netlify/functions/tutor"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
